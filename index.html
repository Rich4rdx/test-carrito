<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulación Carrito de Compras</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header__container">
            <h1 class="header__title">TechStore</h1>

            <button id="toggle-cart-btn" class="header__cart-button">
                🛒 Carrito
                <span id="cart-count" class="cart-badge">0</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-layout">

        <!-- PRODUCT CATALOG -->
        <section class="product-section">
            <h2 class="section-title">Productos</h2>

            <div id="product-list" class="product-grid">
                
                <!-- CARD 1 -->
                <article class="product-card">
                    <img src="/assets/laptop.jpg" alt="Producto 1" class="product-card__image">
                    
                    <div class="product-card__body">
                        <h3 class="product-card__title">Laptop Gamer</h3>
                        <p class="product-card__description">Alto rendimiento para gaming.</p>
                        <p class="product-card__price">$1500</p>

                        <button 
                            class="product-card__button"
                            data-id="1"
                            data-name="Laptop Gamer"
                            data-price="1500">
                            Agregar al carrito
                        </button>
                    </div>
                </article>

                <!-- CARD 2 -->
                <article class="product-card">
                    <img src="/assets/mouse.jpg" alt="Producto 2" class="product-card__image">
                    
                    <div class="product-card__body">
                        <h3 class="product-card__title">Mouse RGB</h3>
                        <p class="product-card__description">Precisión y estilo.</p>
                        <p class="product-card__price">$50</p>

                        <button 
                            class="product-card__button"
                            data-id="2"
                            data-name="Mouse RGB"
                            data-price="50">
                            Agregar al carrito
                        </button>
                    </div>
                </article>

                <!-- CARD 3 -->
                <article class="product-card">
                    <img src="/assets/teclado.jpg" alt="Producto 3" class="product-card__image">
                    
                    <div class="product-card__body">
                        <h3 class="product-card__title">Teclado Mecánico</h3>
                        <p class="product-card__description">Switches mecánicos profesionales.</p>
                        <p class="product-card__price">$120</p>

                        <button 
                            class="product-card__button"
                            data-id="3"
                            data-name="Teclado Mecánico"
                            data-price="120">
                            Agregar al carrito
                        </button>
                    </div>
                </article>

            </div>
        </section>

        <!-- CART PANEL -->
        <aside id="cart-panel" class="cart-panel">

            <h2 class="section-title">Carrito</h2>

            <div id="cart-items" class="cart-items">
                <!-- Aquí tú renderizarás los productos con JS -->
                <p class="cart-empty">El carrito está vacío</p>
            </div>

            <div class="cart-summary">
                <p class="cart-subtotal">
                    Subtotal: $<span id="cart-subtotal">0</span>
                </p>

                <button id="clear-cart-btn" class="cart-clear-button">
                    Vaciar carrito
                </button>
            </div>

        </aside>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
